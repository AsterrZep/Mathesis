# Release — binarios precompilados multiplataforma
#
# Por cada tag v* (o manualmente vía workflow_dispatch):
#   1) Compila el engine Julia con PackageCompiler → sidecar relocatable
#      (self-contained, NO necesita Julia en el equipo final). Se cachea
#      por hash de engine/ + tools/ para saltarse los ~20-40 min.
#   2) `tauri build` con el engine dentro del bundle (resources: engine-runtime).
#   3) Sube los instaladores como artifacts; en tags crea un draft release.
#
# Plataformas: Linux (AppImage/deb/rpm), macOS arm64 (dmg), Windows (NSIS/MSI).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      # ── 1) Engine Julia (PackageCompiler) ────────────────────────────────
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Cache del app Julia compilado
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: src-tauri/engine-runtime
          key: engine-app-${{ matrix.platform.name }}-${{ hashFiles('engine/**', 'tools/**') }}
      - name: Instalar PackageCompiler
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Compilar engine → src-tauri/engine-runtime
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: julia --project=tools tools/build-engine-app.jl
      - name: Smoke test del engine compilado (NDJSON)
        shell: bash
        run: |
          EXE="src-tauri/engine-runtime/bin/mathesis-engine"
          [ "$RUNNER_OS" = "Windows" ] && EXE="$EXE.exe"
          printf '{"jsonrpc":"2.0","id":1,"method":"eval_cell","params":{"cellId":"c","ast":["Add",2,2],"env":{}}}\n' \
            | "$EXE" | grep -q '"value":"4"'
          echo "engine OK: 2+2=4"

      # ── 2) Rust + Node + deps de sistema ─────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri exige que exista el externalBin del target; en release el
      # engine real viene de engine-runtime (resources), así que basta un
      # placeholder donde no hay wrapper commiteado (Windows)
      - name: Placeholder del sidecar dev (solo si falta)
        shell: bash
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          F="src-tauri/binaries/mathesis-engine-$HOST"
          if [ "$RUNNER_OS" = "Windows" ]; then F="$F.exe"; fi
          if [ ! -f "$F" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              printf 'rem placeholder dev (el engine real viene de engine-runtime)\r\n' > "$F"
            else
              printf '#!/bin/sh\necho "placeholder dev: usa tools/build-engine-app.jl" >&2\nexit 1\n' > "$F"
              chmod +x "$F"
            fi
            echo "creado $F"
          fi
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── 3) Tauri build (instaladores con el engine empaquetado) ──────────
      - name: Build de la app
        run: pnpm tauri build

      - name: Subir instaladores (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mathesis-${{ matrix.platform.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          body: |
            Mathesis ${{ github.ref_name }} — build con engine Julia precompilado
            (PackageCompiler, no requiere Julia instalada).
            Ver `Documentacion/04-plan/fases.md` para el estado de la fase.
