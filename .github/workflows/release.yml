# Release — binarios precompilados (Linux)
#
# Por cada tag v* (o manualmente vía workflow_dispatch):
#   1) Compila el engine Julia con PackageCompiler → sidecar relocatable
#      (self-contained, NO necesita Julia en el equipo final). Se cachea
#      por hash de engine/ + tools/ para saltarse los ~20-40 min.
#   2) `tauri build` con el engine dentro del bundle (resources: engine-runtime).
#   3) Sube los instaladores como artifacts; en tags crea un draft release.
#
# Plataforma: Linux x86_64 (AppImage + deb + rpm). macOS/Windows se añaden
# cuando toque (matriz ampliable en este mismo archivo).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1) Engine Julia (PackageCompiler) ────────────────────────────────
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Cache del app Julia compilado
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: src-tauri/engine-runtime
          key: engine-app-linux-${{ hashFiles('engine/**', 'tools/**') }}
      - name: Instalar PackageCompiler
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Compilar engine → src-tauri/engine-runtime
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: julia --project=tools tools/build-engine-app.jl
      - name: Smoke test del engine compilado (NDJSON)
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"eval_cell","params":{"cellId":"c","ast":["Add",2,2],"env":{}}}\n' \
            | src-tauri/engine-runtime/bin/mathesis-engine | grep -q '"value":"4"'
          echo "engine OK: 2+2=4"

      # ── 2) Rust + Node + deps de sistema ─────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias del sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── 3) Tauri build (AppImage + deb + rpm con el engine empaquetado) ──
      - name: Build de la app
        run: pnpm tauri build

      - name: Subir instaladores (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mathesis-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          body: |
            Mathesis ${{ github.ref_name }} (Linux x86_64) — build con engine
            Julia precompilado (PackageCompiler, no requiere Julia instalada).
            Instaladores: AppImage · .deb (Debian/Ubuntu) · .rpm (Fedora/RHEL).
            Ver `Documentacion/04-plan/fases.md` para el estado de la fase.
